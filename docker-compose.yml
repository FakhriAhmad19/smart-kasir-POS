services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-kasir-app
    container_name: smart-kasir-app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - kasir-network

  webserver:
    image: nginx:alpine
    container_name: smart-kasir-webserver
    restart: unless-stopped
    tty: true
    ports:
      - "8060:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf
    networks:
      - kasir-network

  db:
    image: mysql:8.0
    container_name: smart-kasir-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smart_kasir
      MYSQL_USER: kasir_user
      MYSQL_PASSWORD: kasir_password
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - kasir-network

networks:
  kasir-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
